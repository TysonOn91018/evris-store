<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EVRIS · 店家管理</title><link rel="stylesheet" href="styles.css?v=73"><link rel="stylesheet" href="admin.css?v=4"></head>
<body class="admin-page">
<header class="admin-header"><a href="index.html">EVRIS <span>STORE MANAGER</span></a><div class="admin-header-actions"><label class="admin-language">Language / 語言<select id="languageSelect" aria-label="Language / 語言"><option value="zh">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></label><a href="products.html">查看商店 ↗</a></div></header>
<main class="admin-main">
<div class="admin-heading"><div><p class="kicker">店家工作台</p><h1>商品與庫存</h1><p>管理每件商品，讓店面保持最新。</p></div><span class="admin-badge" id="connectionState">尚未登入</span></div>
<section id="adminLogin" class="admin-login"><div><p class="kicker">專屬管理入口</p><h2>登入店家帳戶</h2><p>使用已驗證電郵的店家帳戶登入，即可更新商品與補貨。</p><a href="index.html#member">還未建立帳戶？前往商店註冊</a></div><form id="adminAuthForm" class="account-form"><label>電郵<input type="email" name="email" required autocomplete="email"></label><label><span>密碼</span><input type="password" name="password" required autocomplete="current-password"></label><button type="submit" class="cart-button" id="adminSignIn">登入管理後台</button><p id="adminAuthMessage" class="form-message" role="status"></p></form></section>
<section id="adminWorkspace" hidden>
<div class="admin-toolbar"><p id="adminIdentity"></p><button id="adminLogout" type="button">登出</button></div>
<div class="admin-stats"><div><span>商品總數</span><strong id="totalProducts">—</strong></div><div><span>上架中</span><strong id="activeProducts">—</strong></div><div><span>剩餘庫存</span><strong id="totalStock">—</strong></div><div><span>已售罄</span><strong id="emptyProducts">—</strong></div></div>
<div class="admin-toolbar"><label class="admin-search">搜尋商品<input id="inventorySearch" type="search" placeholder="輸入商品名稱或編號"></label><button id="reloadInventory" type="button">重新載入</button><button id="newProduct" type="button" class="admin-primary">＋ 新增商品</button></div>
<p id="inventoryMessage" role="status"></p>
<div class="inventory-table-wrap"><table><thead><tr><th>商品</th><th>售價（JPY）</th><th>庫存</th><th>狀態</th><th>管理</th></tr></thead><tbody id="inventoryRows"></tbody></table></div>
<div id="inventoryEmpty" class="admin-empty" hidden><h2>建立第一批商品</h2><p>可以從商店現有商品匯入，庫存會從 0 開始；補上實際數量後才開放購買。</p><button type="button" id="importCatalog">匯入現有商品</button></div>
</section>
<dialog id="productEditor" class="admin-editor"><form id="productEditorForm"><div class="admin-toolbar"><h2 id="editorTitle">編輯商品</h2><button type="button" id="closeEditor">關閉</button></div>
<label>商品編號<input name="slug" required pattern="[a-z0-9-]{1,100}" placeholder="例如 citrine-pearl-bracelet"></label>
<label>商品名稱<input name="name" required maxlength="160"></label>
<div class="admin-field-row"><label>分類<select name="category"><option value="bracelet">手鍊</option><option value="earring">耳環</option><option value="necklace">頸鍊</option></select></label><label>售價（JPY）<input name="price" type="number" min="0" max="10000000" step="1" required></label></div>
<label>商品介紹<textarea name="description" rows="4" maxlength="2000"></textarea></label>
<label>材質<input name="material" maxlength="2000"></label><label>搭配介紹<textarea name="style" rows="2" maxlength="2000"></textarea></label>
<label>選擇商品圖片<input type="file" id="productImageFile" accept="image/jpeg,image/png,image/webp"></label>
<p class="image-help">JPG、PNG 或 WebP，每張最多 5 MB。選圖後先上傳，再儲存商品。</p>
<div class="admin-toolbar"><button type="button" id="uploadProductImage" disabled>上傳圖片</button><button type="button" id="cancelProductImage" hidden>取消選擇</button></div>
<label>商品圖片網址或路徑<input name="image_path" required maxlength="1000" placeholder="https://… 或 assets/products/example.jpg" aria-describedby="imageHelp"></label>
<p id="imageHelp" class="image-help">可使用網上圖片的完整 HTTPS 網址，或現有商品圖片路徑。</p>
<img id="productImagePreview" class="product-image-preview" alt="商品圖片預覽" hidden>
<p id="imageMessage" class="image-help" role="status"></p>
<div class="admin-field-row"><label>庫存操作<select name="stockMode"><option value="set">盤點：設定總庫存</option><option value="add">補貨：增加數量</option></select></label><label id="stockLabel">數量<input name="stock" type="number" min="0" max="1000000" step="1" required></label></div>
<label class="admin-checkbox"><input name="is_active" type="checkbox">在商店上架</label>
<p id="editorMessage" role="status"></p><button type="submit" id="saveProduct" class="admin-primary">儲存並更新商店</button>
</form></dialog>
</main>
<script src="admin-language.js?v=2"></script><script src="products-data.js?v=2"></script><script src="inventory-model.js?v=3"></script><script src="firebase-config.js?v=3"></script><script src="firebase-backend.js?v=9"></script><script src="auth-feedback.js?v=6"></script><script src="admin.js?v=5"></script><script src="cloudinary-config.js?v=2"></script><script src="product-image-upload.js?v=1"></script>
</body></html>
